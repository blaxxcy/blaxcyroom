<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>BLAXCY Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{
  margin:0;
  height:100%;
  background:#050505;
  color:#eee;
  font:13px system-ui,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  width:min(100vw,calc(100vh*16/9));
  aspect-ratio:16/9;
  height:auto;
  display:block;
}

#hud{
  position:fixed;
  left:10px;
  top:10px;
  background:#000b;
  padding:8px 12px;
  border-radius:8px;
  line-height:1.5;
  max-width:620px;
  z-index:20;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="hud">
  <b>BLAXCY Room</b> · 2K (2560×1440)<br>
  <span id="st">Loading…</span><br>
  <small>
    Drag: ghurao · Scroll: zoom ·
    H: remove-mode · Shift+click: setup move · Z: undo
  </small>
</div>

<script type="module">

import * as THREE from 'three';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
  DRACOLoader
} from 'three/addons/loaders/DRACOLoader.js';

import {
  MeshoptDecoder
} from 'three/addons/libs/meshopt_decoder.module.js';


// ============================================================
// CONFIG
// ============================================================

const CFG = {

  room:
    'red_room (1).glb',

  table:
    'table.glb',

  chair:
    'black_ergonomic_gaming_chair.glb',

  laptop:
    'laptop_and_mouse.glb',


  // ----------------------------------------------------------
  // MODEL SIZES
  // ----------------------------------------------------------

  roomHeight:
    2.8,

  tableHeight:
    0.68,

  chairHeight:
    1.1,

  laptopWidth:
    0.6,


  // ----------------------------------------------------------
  // OBJECT DETECTION
  // ----------------------------------------------------------

  hideTV:
    /(^|[^a-z])(tv|television|monitor|screen)([^a-z]|$)/i,


  hideFurniture:
    /dresser|cabinet|drawer|commode|sideboard|console|tv[_\s-]?(stand|unit|table)|chest|nightstand|bedside|bureau|wardrobe/i,


  hideDoor:
    /door|doorway|doorframe|door_frame|door-frame|entrance/i,


  hideWallDecor:
    /painting|picture|wall[_\s-]?art|artwork|poster|photo|decoration/i,


  hide: [],


  // ----------------------------------------------------------
  // DISTANCE / PLACEMENT
  // ----------------------------------------------------------

  wallGap:
    0.10,

  chairGap:
    0.12,


  // ----------------------------------------------------------
  // CAMERA
  // ----------------------------------------------------------

  cameraDistance:
    2.5,

  cameraHeight:
    1.7
};


// ============================================================
// BASIC
// ============================================================

const W = 2560;
const H = 1440;

const $ =
  id =>
    document.getElementById(id);

const status =
  text =>
    $('st').textContent = text;

const V =
  (x=0,y=0,z=0) =>
    new THREE.Vector3(x,y,z);

const box =
  object =>
    new THREE.Box3().setFromObject(object);


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(1);

renderer.setSize(
  W,
  H,
  false
);

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.1;

document.body.appendChild(
  renderer.domElement
);

const canvas =
  renderer.domElement;


// ============================================================
// SCENE
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(
    0x050505
  );


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    60,
    W/H,
    0.05,
    100
  );


// ============================================================
// CONTROLS
// ============================================================

const controls =
  new OrbitControls(
    camera,
    canvas
  );

controls.enableDamping =
  true;

controls.minDistance =
  0.4;

controls.maxDistance =
  8;


// ============================================================
// LIGHT
// ============================================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x553333,
    1.1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    1.4
  );

sun.position.set(
  2,
  4,
  3
);

scene.add(sun);


// ============================================================
// GLTF LOADER
// ============================================================

const draco =
  new DRACOLoader();

draco.setDecoderPath(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/'
);

const loader =
  new GLTFLoader();

loader.setDRACOLoader(
  draco
);

loader.setMeshoptDecoder(
  MeshoptDecoder
);


async function load(
  file
){

  const result =
    await loader.loadAsync(
      encodeURI(file)
    );

  return result.scene;
}


// ============================================================
// WRAP MODEL
// ============================================================

function wrap(
  object,
  dimension,
  target
){

  const size =
    box(object).getSize(
      V()
    );


  let current;


  if(
    dimension === 'xz'
  ){

    current =
      Math.max(
        size.x,
        size.z
      );

  }else{

    current =
      size[dimension];

  }


  if(
    !current ||
    !isFinite(current)
  ){

    return object;

  }


  object.scale.multiplyScalar(
    target / current
  );


  object.updateMatrixWorld(
    true
  );


  const b =
    box(object);

  const center =
    b.getCenter(V());


  // Bottom-center pivot
  object.position.sub(
    V(
      center.x,
      b.min.y,
      center.z
    )
  );


  const group =
    new THREE.Group();

  group.add(object);

  return group;
}


// ============================================================
// VISIBILITY
// ============================================================

function isVisible(
  object
){

  for(
    let p = object;
    p;
    p = p.parent
  ){

    if(!p.visible)
      return false;

  }

  return true;
}


// ============================================================
// FIND TOP-LEVEL ROOT
// ============================================================

function topRoomChild(
  node,
  roomS
){

  let current =
    node;


  while(
    current.parent &&
    current.parent !== roomS
  ){

    current =
      current.parent;

  }


  return current;
}


// ============================================================
// GET CENTER / SIZE
// ============================================================

function getInfo(
  object
){

  const b =
    box(object);

  return {

    box:b,

    center:b.getCenter(V()),

    size:b.getSize(V())

  };

}


// ============================================================
// MAIN
// ============================================================

try{

  // ==========================================================
  // LOAD MODELS
  // ==========================================================

  const [
    roomS,
    tableS,
    chairS,
    laptopS
  ] =
  await Promise.all([

    CFG.room,

    CFG.table,

    CFG.chair,

    CFG.laptop

  ].map(load));


  // ==========================================================
  // WRAP
  // ==========================================================

  const room =
    wrap(
      roomS,
      'y',
      CFG.roomHeight
    );


  const table =
    wrap(
      tableS,
      'y',
      CFG.tableHeight
    );


  const chair =
    wrap(
      chairS,
      'y',
      CFG.chairHeight
    );


  const laptop =
    wrap(
      laptopS,
      'xz',
      CFG.laptopWidth
    );


  scene.add(
    room,
    table,
    chair,
    laptop
  );


  room.updateMatrixWorld(
    true
  );


  // ==========================================================
  // CHAIR MATERIAL
  // ==========================================================

  chair.traverse(
    node => {

      if(!node.isMesh)
        return;


      const materials =
        Array.isArray(node.material)
          ? node.material
          : [node.material];


      materials.forEach(
        material => {

          if(!material)
            return;


          if(material.map){

            material.color.setHex(
              0x777777
            );

          }else{

            material.color.setHex(
              0x17191d
            );

          }


          material.roughness =
            0.65;

          material.metalness =
            0.05;

        }
      );

    }
  );


  // ==========================================================
  // ROOM BOUNDS
  // ==========================================================

  const roomBox =
    box(room);

  const roomSize =
    roomBox.getSize(V());

  const roomCenter =
    roomBox.getCenter(V());

  const floorY =
    roomBox.min.y;


  // ==========================================================
  // HIDE STACK
  // ==========================================================

  const hiddenStack = [];


  function hideObject(
    object
  ){

    if(!object)
      return;


    if(object.visible){

      object.visible =
        false;

      hiddenStack.push(
        object
      );

    }

  }


  // ==========================================================
  // FIND FURNITURE ROOTS
  // ==========================================================

  const furnitureRoots =
    new Map();


  const doorRoots =
    new Map();


  const tvRoots =
    new Map();


  const decorRoots =
    new Map();


  roomS.traverse(
    node => {

      const name =
        node.name || '';


      const root =
        topRoomChild(
          node,
          roomS
        );


      // ------------------------------------------------------
      // Furniture
      // ------------------------------------------------------

      if(
        CFG.hideFurniture.test(
          name
        )
      ){

        furnitureRoots.set(
          root.uuid,
          root
        );

      }


      // ------------------------------------------------------
      // Doors
      // ------------------------------------------------------

      if(
        CFG.hideDoor.test(
          name
        )
      ){

        doorRoots.set(
          root.uuid,
          root
        );

      }


      // ------------------------------------------------------
      // TV
      // ------------------------------------------------------

      if(
        CFG.hideTV.test(
          name
        )
      ){

        tvRoots.set(
          root.uuid,
          root
        );

      }


      // ------------------------------------------------------
      // Wall decoration
      // ------------------------------------------------------

      if(
        CFG.hideWallDecor.test(
          name
        )
      ){

        decorRoots.set(
          root.uuid,
          root
        );

      }

    }
  );


  // ==========================================================
  // FURNITURE CANDIDATES
  // ==========================================================

  const candidates = [];


  for(
    const root of furnitureRoots.values()
  ){

    root.updateMatrixWorld(
      true
    );


    const info =
      getInfo(root);


    const s =
      info.size;


    /*
      Drawer / cabinet / console সাধারণত:

      - খুব বেশি লম্বা vertical object নয়
      - floor-এর কাছে থাকে
      - wall-এর কাছে থাকে
      - width > depth
    */


    const width =
      Math.max(
        s.x,
        s.z
      );


    const depth =
      Math.min(
        s.x,
        s.z
      );


    const height =
      s.y;


    const bottomDistance =
      Math.abs(
        info.box.min.y -
        floorY
      );


    const nearFloor =
      bottomDistance <
      roomSize.y * 0.30;


    const shallow =
      depth <
      roomSize.x * 0.45;


    const reasonableHeight =
      height <
      roomSize.y * 0.65;


    const reasonableWidth =
      width >
      roomSize.x * 0.15;


    let score = 0;


    if(nearFloor)
      score += 30;


    if(shallow)
      score += 25;


    if(reasonableHeight)
      score += 20;


    if(reasonableWidth)
      score += 20;


    // Prefer furniture with explicit drawer/console name
    let named = false;


    root.traverse(
      n => {

        const nName =
          n.name || '';


        if(
          /drawer|dresser|cabinet|console|sideboard|commode/i.test(
            nName
          )
        ){

          named = true;

        }

      }
    );


    if(named)
      score += 80;


    candidates.push({

      root,

      info,

      score

    });

  }


  // ==========================================================
  // SELECT BEST DRAWER / CONSOLE
  // ==========================================================

  candidates.sort(
    (a,b) =>
      b.score -
      a.score
  );


  let targetFurniture =
    candidates.length
      ? candidates[0]
      : null;


  console.log(
    'Furniture candidates:',
    candidates.map(
      c => ({
        name:c.root.name,
        score:c.score,
        size:c.info.size,
        center:c.info.center
      })
    )
  );


  // ==========================================================
  // HIDE TARGET FURNITURE
  // ==========================================================

  if(
    targetFurniture
  ){

    /*
      পুরো root hide হবে।
      তাই শুধু drawer-এর ছোট mesh না,
      পুরো cabinet/console চলে যাবে।
    */

    hideObject(
      targetFurniture.root
    );

  }


  // ==========================================================
  // HIDE DOORS
  // ==========================================================

  for(
    const root of doorRoots.values()
  ){

    hideObject(root);

  }


  // ==========================================================
  // HIDE TV
  // ==========================================================

  for(
    const root of tvRoots.values()
  ){

    hideObject(root);

  }


  // ==========================================================
  // HIDE WALL DECOR
  // ==========================================================

  for(
    const root of decorRoots.values()
  ){

    hideObject(root);

  }


  // ==========================================================
  // TARGET POSITION
  // ==========================================================

  let targetBox;

  let targetCenter;


  if(
    targetFurniture
  ){

    targetBox =
      targetFurniture.info.box.clone();


    targetCenter =
      targetFurniture.info.center.clone();

  }else{

    /*
      Fallback:
      room center নয়।

      Back wall-এর দিকে fallback।
    */

    targetCenter =
      V(
        roomCenter.x,
        floorY,
        roomBox.min.z +
        roomSize.z * 0.22
      );

    targetBox =
      new THREE.Box3()
        .setFromCenterAndSize(
          targetCenter.clone(),
          V(
            roomSize.x * 0.35,
            0.8,
            roomSize.z * 0.20
          )
        );

  }


  // ==========================================================
  // FIND WALL SIDE
  // ==========================================================
  //
  // Target furniture-এর সবচেয়ে কাছের room wall বের করা।
  //
  // তারপর table wall-এর দিকে খুব কাছে না গিয়ে
  // logical distance-এ বসবে।
  // ==========================================================

  const distances = {

    left:
      Math.abs(
        targetCenter.x -
        roomBox.min.x
      ),

    right:
      Math.abs(
        roomBox.max.x -
        targetCenter.x
      ),

    back:
      Math.abs(
        targetCenter.z -
        roomBox.min.z
      ),

    front:
      Math.abs(
        roomBox.max.z -
        targetCenter.z
      )

  };


  let wallSide =
    Object.entries(
      distances
    ).sort(
      (a,b) =>
        a[1] -
        b[1]
    )[0][0];


  /*
    Screenshot-এর setup back wall-এর দিকে হওয়ায়
    tie হলে back prefer করা হবে।
  */

  const wallDirections = {

    left:
      V(-1,0,0),

    right:
      V(1,0,0),

    back:
      V(0,0,-1),

    front:
      V(0,0,1)

  };


  let wallDir =
    wallDirections[
      wallSide
    ];


  // ==========================================================
  // SETUP CENTER
  // ==========================================================
  //
  // Furniture যেখানেই থাকুক,
  // table তার জায়গার কাছাকাছি থাকবে।
  //
  // wall থেকে ছোট gap।
  // ==========================================================

  const setup =
    targetCenter.clone();


  setup.y =
    floorY;


  // Push setup slightly away from wall
  if(
    wallSide === 'left'
  ){

    setup.x =
      roomBox.min.x +
      Math.max(
        0.65,
        targetBox.getSize(V()).x * 0.55
      );

  }


  if(
    wallSide === 'right'
  ){

    setup.x =
      roomBox.max.x -
      Math.max(
        0.65,
        targetBox.getSize(V()).x * 0.55
      );

  }


  if(
    wallSide === 'back'
  ){

    setup.z =
      roomBox.min.z +
      Math.max(
        0.65,
        targetBox.getSize(V()).z * 0.55
      );

  }


  if(
    wallSide === 'front'
  ){

    setup.z =
      roomBox.max.z -
      Math.max(
        0.65,
        targetBox.getSize(V()).z * 0.55
      );

  }


  // ==========================================================
  // TABLE ORIENTATION
  // ==========================================================
  //
  // Table-এর back side wall-এর দিকে।
  // Table-এর front room-এর দিকে।
  // ==========================================================

  let tableYaw;


  if(
    wallSide === 'back'
  ){

    tableYaw = 0;

  }else if(
    wallSide === 'front'
  ){

    tableYaw = Math.PI;

  }else if(
    wallSide === 'left'
  ){

    tableYaw = Math.PI / 2;

  }else{

    tableYaw = -Math.PI / 2;

  }


  table.rotation.set(
    0,
    tableYaw,
    0
  );


  table.position.set(
    setup.x,
    floorY,
    setup.z
  );


  table.updateMatrixWorld(
    true
  );


  // ==========================================================
  // MAKE TABLE TOUCH FLOOR
  // ==========================================================

  let tableBox =
    box(table);


  table.position.y +=
    floorY -
    tableBox.min.y;


  table.updateMatrixWorld(
    true
  );


  tableBox =
    box(table);


  // ==========================================================
  // LAPTOP ORIENTATION
  // ==========================================================
  //
  // Laptop-এর local orientation inspect করা হবে।
  //
  // X/Z tilt কখনো দেওয়া হবে না।
  // শুধু Y rotation।
  //
  // table-এর long axis অনুযায়ী straight রাখা হবে।
  // ==========================================================

  laptop.rotation.set(
    0,
    tableYaw,
    0
  );


  laptop.updateMatrixWorld(
    true
  );


  /*
    Laptop model যদি sideways থাকে,
    তার bounding box table-এর সাথে compare করা হবে।
  */


  const laptopBox =
    box(laptop);


  const laptopSize =
    laptopBox.getSize(V());


  const tableSize =
    tableBox.getSize(V());


  /*
    Laptop-এর longer horizontal dimension
    table-এর longer dimension-এর same direction-এ
    রাখব।
  */

  const tableLong =
    Math.max(
      tableSize.x,
      tableSize.z
    );


  const laptopLong =
    Math.max(
      laptopSize.x,
      laptopSize.z
    );


  if(
    tableSize.x >
    tableSize.z
  ){

    /*
      Table long axis X
    */

    if(
      laptopSize.z >
      laptopSize.x
    ){

      laptop.rotation.y +=
        Math.PI / 2;

    }

  }else{

    /*
      Table long axis Z
    */

    if(
      laptopSize.x >
      laptopSize.z
    ){

      laptop.rotation.y +=
        Math.PI / 2;

    }

  }


  // IMPORTANT:
  // X/Z rotation = ZERO
  laptop.rotation.x =
    0;

  laptop.rotation.z =
    0;


  // ==========================================================
  // LAPTOP CENTER
  // ==========================================================

  laptop.position.set(
    setup.x,
    tableBox.max.y + 0.015,
    setup.z
  );


  laptop.updateMatrixWorld(
    true
  );


  // ==========================================================
  // CHAIR
  // ==========================================================
  //
  // Chair table-এর front side-এ।
  // Chair table-এর দিকে face করবে।
  // ==========================================================

  chair.rotation.set(
    0,
    tableYaw + Math.PI,
    0
  );


  chair.updateMatrixWorld(
    true
  );


  const chairSize =
    box(chair).getSize(V());


  /*
    Table-এর front direction
  */

  const frontDir =
    V(
      -wallDir.x,
      0,
      -wallDir.z
    );


  const tableDepth =
    Math.min(
      tableSize.x,
      tableSize.z
    );


  const chairDistance =
    tableDepth / 2 +
    chairSize.z / 2 +
    CFG.chairGap;


  chair.position.set(
    setup.x +
    frontDir.x *
    chairDistance,

    floorY,

    setup.z +
    frontDir.z *
    chairDistance
  );


  chair.updateMatrixWorld(
    true
  );


  // ==========================================================
  // CHAIR FLOOR
  // ==========================================================

  let chairBox =
    box(chair);


  chair.position.y +=
    floorY -
    chairBox.min.y;


  chair.updateMatrixWorld(
    true
  );


  // ==========================================================
  // FINAL LAPTOP HEIGHT
  // ==========================================================

  tableBox =
    box(table);


  laptop.position.y =
    tableBox.max.y +
    0.015;


  laptop.updateMatrixWorld(
    true
  );


  // ==========================================================
  // CAMERA
  // ==========================================================

  const cameraTarget =
    V(
      setup.x,
      floorY + 0.9,
      setup.z
    );


  controls.target.copy(
    cameraTarget
  );


  camera.position.set(
    setup.x +
    frontDir.x *
    CFG.cameraDistance +
    wallDir.x *
    1.0,

    floorY +
    CFG.cameraHeight,

    setup.z +
    frontDir.z *
    CFG.cameraDistance +
    wallDir.z *
    1.0
  );


  camera.lookAt(
    cameraTarget
  );


  // ==========================================================
  // STATUS
  // ==========================================================

  status(
    'Ready · drawer/cabinet removed · setup placed in its position · laptop straight · hidden: ' +
    hiddenStack.length
  );


  console.log(
    'Target furniture:',
    targetFurniture?.root?.name
  );

  console.log(
    'Target position:',
    targetCenter
  );

  console.log(
    'Wall side:',
    wallSide
  );

  console.log(
    'Setup:',
    setup
  );

  console.log(
    'Laptop rotation:',
    laptop.rotation.y
  );


  // ==========================================================
  // REMOVE MODE
  // ==========================================================

  let removeMode =
    false;

  let pointerStart =
    [0,0];


  const raycaster =
    new THREE.Raycaster();

  const mouse =
    new THREE.Vector2();


  // ==========================================================
  // KEYBOARD
  // ==========================================================

  addEventListener(
    'keydown',
    event => {

      const key =
        event.key.toLowerCase();


      // H
      if(
        key === 'h'
      ){

        removeMode =
          !removeMode;


        canvas.style.cursor =
          removeMode
            ? 'crosshair'
            : '';


        status(
          removeMode
            ? 'Remove-mode ON · object-e click koro'
            : 'Remove-mode OFF'
        );

      }


      // Z
      if(
        key === 'z' &&
        hiddenStack.length
      ){

        const object =
          hiddenStack.pop();


        object.visible =
          true;


        status(
          'Undo: ' +
          (
            object.name ||
            object.type
          )
        );

      }

    }
  );


  // ==========================================================
  // POINTER DOWN
  // ==========================================================

  canvas.addEventListener(
    'pointerdown',
    event => {

      pointerStart = [
        event.clientX,
        event.clientY
      ];

    }
  );


  // ==========================================================
  // POINTER UP
  // ==========================================================

  canvas.addEventListener(
    'pointerup',
    event => {

      if(!removeMode)
        return;


      const movement =
        Math.hypot(

          event.clientX -
          pointerStart[0],

          event.clientY -
          pointerStart[1]

        );


      if(
        movement > 4
      ){

        return;

      }


      const rect =
        canvas.getBoundingClientRect();


      mouse.set(

        (
          event.clientX -
          rect.left
        ) /
        rect.width *
        2 - 1,

        -(
          (
            event.clientY -
            rect.top
          ) /
          rect.height
        ) *
        2 + 1

      );


      raycaster.setFromCamera(
        mouse,
        camera
      );


      const hits =
        raycaster.intersectObject(
          room,
          true
        );


      const hit =
        hits.find(
          item =>
            isVisible(
              item.object
            )
        );


      if(!hit)
        return;


      const object =
        hit.object;


      hideObject(
        object
      );


      // ------------------------------------------------------
      // SHIFT + CLICK
      // ------------------------------------------------------

      if(
        event.shiftKey
      ){

        const point =
          hit.point;


        table.position.x =
          point.x;

        table.position.z =
          point.z;

        table.position.y =
          floorY;


        table.updateMatrixWorld(
          true
        );


        let tb =
          box(table);


        table.position.y +=
          floorY -
          tb.min.y;


        table.updateMatrixWorld(
          true
        );


        tb =
          box(table);


        laptop.position.set(
          point.x,
          tb.max.y + 0.015,
          point.z
        );


        laptop.rotation.x =
          0;

        laptop.rotation.z =
          0;


        laptop.updateMatrixWorld(
          true
        );


        const cs =
          box(chair).getSize(V());


        const ts =
          tb.getSize(V());


        const distance =
          Math.min(
            ts.x,
            ts.z
          ) / 2 +
          cs.z / 2 +
          CFG.chairGap;


        chair.position.set(
          point.x +
          frontDir.x *
          distance,

          floorY,

          point.z +
          frontDir.z *
          distance
        );


        chair.updateMatrixWorld(
          true
        );


        let cb =
          box(chair);


        chair.position.y +=
          floorY -
          cb.min.y;


        chair.updateMatrixWorld(
          true
        );


        status(
          'Setup moved · laptop straight'
        );

      }else{

        status(
          'Hidden: ' +
          (
            object.name ||
            object.type
          )
        );

      }

    }
  );


  // ==========================================================
  // RENDER LOOP
  // ==========================================================

  renderer.setAnimationLoop(
    () => {

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }
  );


}catch(error){

  console.error(
    'BLAXCY Room Error:',
    error
  );


  status(
    'Error: ' +
    error.message
  );

}

</script>

</body>
</html>
