<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>BLAXCY Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{
  margin:0;
  height:100%;
  background:#050505;
  color:#eee;
  font:13px system-ui,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  width:min(100vw,calc(100vh*16/9));
  aspect-ratio:16/9;
  height:auto;
  display:block;
}

#hud{
  position:fixed;
  left:10px;
  top:10px;
  background:#000a;
  padding:8px 12px;
  border-radius:8px;
  line-height:1.5;
  max-width:560px;
  z-index:20;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="hud">
  <b>BLAXCY Room</b> · 2K (2560×1440)<br>
  <span id="st">Loading…</span><br>
  <small>
    Drag: ghurao · Scroll: zoom ·
    H: remove-mode · Shift+click: setup move · Z: undo
  </small>
</div>

<script type="module">

import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';


// ============================================================
// CONFIG
// ============================================================

const CFG = {

  room: 'red_room (1).glb',

  table: 'table.glb',

  chair: 'black_ergonomic_gaming_chair.glb',

  laptop: 'laptop_and_mouse.glb',


  // ----------------------------------------------------------
  // SIZE
  // ----------------------------------------------------------

  roomHeight: 2.8,

  tableHeight: 0.68,

  chairHeight: 1.1,

  laptopWidth: 0.6,


  // ----------------------------------------------------------
  // OBJECTS TO REMOVE
  // ----------------------------------------------------------

  hideTV:
    /(^|[^a-z])(tv|television|monitor|screen)([^a-z]|$)/i,


  hideFurniture:
    /dresser|cabinet|drawer|commode|sideboard|console|tv[_\s-]?(stand|unit|table)|chest|nightstand|bedside|bureau|wardrobe/i,


  hideDoor:
    /door|doorway|doorframe|door_frame|door-frame|entrance/i,


  hideWallDecor:
    /painting|picture|wall[_\s-]?art|artwork|poster|photo|decoration/i,


  hide: [],


  // ----------------------------------------------------------
  // MODEL ROTATION
  // ----------------------------------------------------------

  tableYaw: 0,

  chairYaw: 0,

  /*
    IMPORTANT:

    Laptop model-er nijer default orientation
    ulta/sideways thakte pare.

    90 degree = table-er sathe straight.
  */
  laptopYaw: 90,


  // ----------------------------------------------------------
  // SETUP POSITION
  // ----------------------------------------------------------

  setupOffsetX: 0,

  setupOffsetZ: -0.18
};


// ============================================================
// BASIC
// ============================================================

const W = 2560;
const H = 1440;

const $ = id =>
  document.getElementById(id);

const st = text =>
  $('st').textContent = text;

const V = (x=0,y=0,z=0) =>
  new THREE.Vector3(x,y,z);

const rad = degrees =>
  degrees * Math.PI / 180;

const box = object =>
  new THREE.Box3().setFromObject(object);


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(1);

renderer.setSize(
  W,
  H,
  false
);

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.1;

document.body.appendChild(
  renderer.domElement
);

const cv =
  renderer.domElement;


// ============================================================
// SCENE
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x050505);


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    60,
    W/H,
    0.05,
    100
  );


// ============================================================
// CONTROLS
// ============================================================

const controls =
  new OrbitControls(
    camera,
    cv
  );

controls.enableDamping = true;

controls.minDistance = 0.4;

controls.maxDistance = 8;


// ============================================================
// LIGHT
// ============================================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x553333,
    1.1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    1.4
  );

sun.position.set(
  2,
  4,
  3
);

scene.add(sun);


// ============================================================
// GLTF
// ============================================================

const draco =
  new DRACOLoader();

draco.setDecoderPath(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/'
);

const gl =
  new GLTFLoader();

gl.setDRACOLoader(draco);

gl.setMeshoptDecoder(
  MeshoptDecoder
);


const load =
  file =>
    gl.loadAsync(
      encodeURI(file)
    ).then(
      result => result.scene
    );


// ============================================================
// WRAP MODEL
// ============================================================

function wrap(
  object,
  dimension,
  targetSize
){

  const size =
    box(object).getSize(V());


  let currentSize;


  if(dimension === 'xz'){

    currentSize =
      Math.max(
        size.x,
        size.z
      );

  }else{

    currentSize =
      size[dimension];

  }


  if(
    !currentSize ||
    !isFinite(currentSize)
  ){

    return object;

  }


  object.scale.multiplyScalar(
    targetSize / currentSize
  );

  object.updateMatrixWorld(true);


  const b =
    box(object);

  const c =
    b.getCenter(V());


  /*
    Pivot = bottom center
  */

  object.position.sub(
    V(
      c.x,
      b.min.y,
      c.z
    )
  );


  const group =
    new THREE.Group();

  group.add(object);

  return group;
}


// ============================================================
// VISIBILITY
// ============================================================

function isVisible(object){

  for(
    let p=object;
    p;
    p=p.parent
  ){

    if(!p.visible){

      return false;

    }

  }

  return true;
}


// ============================================================
// MAIN
// ============================================================

try{

  // ==========================================================
  // LOAD
  // ==========================================================

  const [
    roomS,
    tableS,
    chairS,
    laptopS
  ] =
  await Promise.all([

    CFG.room,

    CFG.table,

    CFG.chair,

    CFG.laptop

  ].map(load));


  // ==========================================================
  // WRAP
  // ==========================================================

  const room =
    wrap(
      roomS,
      'y',
      CFG.roomHeight
    );


  const table =
    wrap(
      tableS,
      'y',
      CFG.tableHeight
    );


  const chair =
    wrap(
      chairS,
      'y',
      CFG.chairHeight
    );


  const laptop =
    wrap(
      laptopS,
      'xz',
      CFG.laptopWidth
    );


  scene.add(
    room,
    table,
    chair,
    laptop
  );


  room.updateMatrixWorld(true);


  // ==========================================================
  // CHAIR MATERIAL
  // ==========================================================

  chair.traverse(
    node => {

      if(!node.isMesh)
        return;


      const materials =
        Array.isArray(node.material)
          ? node.material
          : [node.material];


      materials.forEach(
        material => {

          if(!material)
            return;


          if(material.map){

            material.color.setHex(
              0x777777
            );

          }else{

            material.color.setHex(
              0x17191d
            );

          }


          material.roughness =
            0.65;

          material.metalness =
            0.05;

        }
      );

    }
  );


  // ==========================================================
  // HIDDEN OBJECT STACK
  // ==========================================================

  const stack = [];


  function hideObj(object){

    if(!object)
      return;


    if(object.visible){

      object.visible = false;

      stack.push(object);

    }

  }


  // ==========================================================
  // REMOVE UNWANTED ROOM FURNITURE
  // ==========================================================

  const hiddenNames = [];


  roomS.traverse(
    node => {

      const name =
        node.name || '';


      // ------------------------------------------------------
      // Own name
      // ------------------------------------------------------

      let match =

        CFG.hide.includes(name) ||

        CFG.hideTV.test(name) ||

        CFG.hideFurniture.test(name) ||

        CFG.hideDoor.test(name) ||

        CFG.hideWallDecor.test(name);


      // ------------------------------------------------------
      // Parent names
      // ------------------------------------------------------

      let parent =
        node.parent;


      while(
        parent &&
        parent !== roomS
      ){

        const parentName =
          parent.name || '';


        if(

          CFG.hideTV.test(parentName) ||

          CFG.hideFurniture.test(parentName) ||

          CFG.hideDoor.test(parentName) ||

          CFG.hideWallDecor.test(parentName)

        ){

          match = true;

          break;

        }


        parent =
          parent.parent;

      }


      if(match){

        hideObj(node);

        hiddenNames.push(
          name || node.type
        );

      }

    }
  );


  // ==========================================================
  // ROOM BOUNDS
  // ==========================================================

  room.updateMatrixWorld(true);


  const roomBox =
    box(room);


  const roomSize =
    roomBox.getSize(V());


  const roomCenter =
    roomBox.getCenter(V());


  const floorY =
    roomBox.min.y;


  // ==========================================================
  // SETUP POSITION
  // ==========================================================

  const setup =
    V(

      roomCenter.x +
      roomSize.x *
      CFG.setupOffsetX,

      floorY,

      roomCenter.z +
      roomSize.z *
      CFG.setupOffsetZ

    );


  /*
    Setup direction.

    Table faces -Z.
    Chair faces -Z.
    Laptop keyboard faces -Z.
  */

  const setupYaw = 0;


  // ==========================================================
  // TABLE
  // ==========================================================

  table.rotation.set(
    0,
    setupYaw +
    rad(CFG.tableYaw),
    0
  );


  table.position.set(
    setup.x,
    floorY,
    setup.z
  );


  table.updateMatrixWorld(true);


  // Make table touch floor
  let tableBox =
    box(table);


  table.position.y +=
    floorY -
    tableBox.min.y;


  table.updateMatrixWorld(true);


  tableBox =
    box(table);


  // ==========================================================
  // LAPTOP
  // ==========================================================
  //
  // VERY IMPORTANT:
  //
  // Laptop-এর rotation শুধু Y axis-এ হবে।
  // X/Z rotation একদম ZERO।
  //
  // তাই laptop কাত হবে না।
  // ==========================================================

  laptop.rotation.set(
    0,
    setupYaw +
    rad(CFG.laptopYaw),
    0
  );


  laptop.position.set(
    setup.x,
    tableBox.max.y + 0.015,
    setup.z
  );


  laptop.updateMatrixWorld(true);


  // ==========================================================
  // CHAIR
  // ==========================================================

  chair.rotation.set(
    0,
    setupYaw +
    Math.PI +
    rad(CFG.chairYaw),
    0
  );


  chair.updateMatrixWorld(true);


  const chairBox0 =
    box(chair);


  const tableSize =
    tableBox.getSize(V());


  const chairSize =
    chairBox0.getSize(V());


  /*
    Chair table-এর সামনে।
  */

  const chairDistance =
    tableSize.z / 2 +
    chairSize.z / 2 -
    0.08;


  chair.position.set(
    setup.x,
    floorY,
    setup.z +
    chairDistance
  );


  chair.updateMatrixWorld(true);


  // Chair floor correction
  let chairBox =
    box(chair);


  chair.position.y +=
    floorY -
    chairBox.min.y;


  chair.updateMatrixWorld(true);


  // ==========================================================
  // FINAL LAPTOP POSITION AFTER TABLE FIX
  // ==========================================================

  tableBox =
    box(table);


  laptop.position.y =
    tableBox.max.y + 0.015;


  laptop.updateMatrixWorld(true);


  // ==========================================================
  // CAMERA
  // ==========================================================

  controls.target.set(
    setup.x,
    floorY + 0.9,
    setup.z
  );


  camera.position.set(
    setup.x + 2.7,
    floorY + 1.75,
    setup.z + 2.7
  );


  camera.lookAt(
    setup.x,
    floorY + 0.9,
    setup.z
  );


  // ==========================================================
  // STATUS
  // ==========================================================

  st(
    'Ready · unwanted furniture removed · laptop straight · hidden: ' +
    hiddenNames.length
  );


  console.log(
    'Hidden objects:',
    hiddenNames
  );


  console.log(
    'Setup:',
    setup
  );


  // ==========================================================
  // REMOVE MODE
  // ==========================================================

  let pick = false;

  let pointerDown =
    [0,0];


  const ray =
    new THREE.Raycaster();


  const mouse =
    new THREE.Vector2();


  // ==========================================================
  // KEYBOARD
  // ==========================================================

  addEventListener(
    'keydown',
    event => {

      const key =
        event.key.toLowerCase();


      // ------------------------------------------------------
      // H
      // ------------------------------------------------------

      if(key === 'h'){

        pick =
          !pick;


        cv.style.cursor =
          pick
            ? 'crosshair'
            : '';


        st(
          pick
            ? 'Remove-mode ON: object-e click koro'
            : 'Remove-mode OFF'
        );

      }


      // ------------------------------------------------------
      // Z
      // ------------------------------------------------------

      if(
        key === 'z' &&
        stack.length
      ){

        const object =
          stack.pop();


        object.visible =
          true;


        st(
          'Undo: ' +
          (
            object.name ||
            object.type
          )
        );

      }

    }
  );


  // ==========================================================
  // POINTER DOWN
  // ==========================================================

  cv.addEventListener(
    'pointerdown',
    event => {

      pointerDown = [
        event.clientX,
        event.clientY
      ];

    }
  );


  // ==========================================================
  // POINTER UP
  // ==========================================================

  cv.addEventListener(
    'pointerup',
    event => {

      if(!pick)
        return;


      const movement =
        Math.hypot(

          event.clientX -
          pointerDown[0],

          event.clientY -
          pointerDown[1]

        );


      if(movement > 4)
        return;


      const rect =
        cv.getBoundingClientRect();


      mouse.set(

        (
          event.clientX -
          rect.left
        ) /
        rect.width *
        2 - 1,

        -(
          (
            event.clientY -
            rect.top
          ) /
          rect.height
        ) *
        2 + 1

      );


      ray.setFromCamera(
        mouse,
        camera
      );


      const hits =
        ray.intersectObject(
          room,
          true
        );


      const hit =
        hits.find(
          item =>
            isVisible(
              item.object
            )
        );


      if(!hit)
        return;


      const object =
        hit.object;


      hideObj(object);


      // ======================================================
      // SHIFT + CLICK
      // ======================================================

      if(event.shiftKey){

        const point =
          hit.point;


        // -----------------------------------------------
        // Move table
        // -----------------------------------------------

        table.position.x =
          point.x;

        table.position.z =
          point.z;

        table.position.y =
          floorY;


        table.updateMatrixWorld(
          true
        );


        // -----------------------------------------------
        // Keep table on floor
        // -----------------------------------------------

        let tb =
          box(table);


        table.position.y +=
          floorY -
          tb.min.y;


        table.updateMatrixWorld(
          true
        );


        tb =
          box(table);


        // -----------------------------------------------
        // Laptop
        // -----------------------------------------------

        laptop.position.set(
          point.x,
          tb.max.y + 0.015,
          point.z
        );


        laptop.rotation.set(
          0,
          setupYaw +
          rad(CFG.laptopYaw),
          0
        );


        laptop.updateMatrixWorld(
          true
        );


        // -----------------------------------------------
        // Chair
        // -----------------------------------------------

        const ts =
          tb.getSize(V());


        const cs =
          box(chair).getSize(V());


        const distance =
          ts.z / 2 +
          cs.z / 2 -
          0.08;


        chair.position.set(
          point.x,
          floorY,
          point.z + distance
        );


        chair.rotation.set(
          0,
          setupYaw +
          Math.PI +
          rad(CFG.chairYaw),
          0
        );


        chair.updateMatrixWorld(
          true
        );


        let cb =
          box(chair);


        chair.position.y +=
          floorY -
          cb.min.y;


        chair.updateMatrixWorld(
          true
        );


        st(
          'Laptop setup moved + straightened'
        );

      }else{

        st(
          'Hidden: ' +
          (
            object.name ||
            object.type
          )
        );

      }

    }
  );


  // ==========================================================
  // RENDER LOOP
  // ==========================================================

  renderer.setAnimationLoop(
    () => {

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }
  );


}catch(error){

  console.error(
    'BLAXCY Room Error:',
    error
  );


  st(
    'Error: ' +
    error.message
  );

}

</script>

</body>
</html>
