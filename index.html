<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">

<title>BLAXCY Room</title>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<style>
html,
body{
  margin:0;
  height:100%;
  background:#050505;
  color:#eee;
  font:13px system-ui,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  width:min(100vw,calc(100vh*16/9));
  aspect-ratio:16/9;
  height:auto;
  display:block;
}

#hud{
  position:fixed;
  left:10px;
  top:10px;
  background:#000a;
  padding:8px 12px;
  border-radius:8px;
  line-height:1.5;
  max-width:460px;
  z-index:10;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="hud">
  <b>BLAXCY Room</b> · 2K (2560×1440)
  <br>

  <span id="st">Loading…</span>

  <br>

  <small>
    Drag: ghurao · Scroll: zoom ·
    H: remove-mode · Z: undo
  </small>
</div>


<script type="module">

import * as THREE from 'three';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
  DRACOLoader
} from 'three/addons/loaders/DRACOLoader.js';

import {
  MeshoptDecoder
} from 'three/addons/libs/meshopt_decoder.module.js';


// ============================================================
// CONFIG
// ============================================================

const CFG = {

  room:
    'red_room (1).glb',

  table:
    'table.glb',

  chair:
    'black_ergonomic_gaming_chair.glb',

  laptop:
    'laptop_and_mouse.glb',


  // ----------------------------------------------------------
  // Real-world approximate sizes
  // ----------------------------------------------------------

  roomHeight:
    2.8,

  tableHeight:
    0.75,

  chairHeight:
    1.1,

  laptopWidth:
    0.6,


  // ----------------------------------------------------------
  // Existing TV / monitor detection
  // ----------------------------------------------------------

  hideTV:
    /(^|[^a-z])(tv|television|monitor)([^a-z]|$)|screen/i,


  // ----------------------------------------------------------
  // Existing furniture that should stay hidden
  // ----------------------------------------------------------

  hideFurniture:
    /dresser|cabinet|drawer|commode|sideboard|console|tv[_\s-]?(stand|unit|table)|chest/i,


  // ----------------------------------------------------------
  // Wall decorations / framed objects
  //
  // This catches names if the GLB has useful node names.
  // ----------------------------------------------------------

  hideWallObject:
    /picture|painting|wall[_\s-]?(art|panel|shelf|clock)|art[_\s-]?frame|wall[_\s-]?decor|decoration|poster|frame/i,


  // Exact node names can be added here later if needed.
  hide:[],


  // ----------------------------------------------------------
  // IMPORTANT
  //
  // Laptop model was facing the wrong direction.
  // 180° fixes its orientation.
  // ----------------------------------------------------------

  yaw:{
    table:0,
    chair:0,
    laptop:180
  }

};


// ============================================================
// BASIC CONSTANTS
// ============================================================

const W = 2560;
const H = 1440;

const $ =
  id => document.getElementById(id);

const st =
  text => $('st').textContent = text;

const V =
  (x=0,y=0,z=0) =>
    new THREE.Vector3(x,y,z);

const rad =
  d => d * Math.PI / 180;

const box =
  object =>
    new THREE.Box3().setFromObject(object);


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(1);

renderer.setSize(
  W,
  H,
  false
);

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.1;

document.body.appendChild(
  renderer.domElement
);

const cv =
  renderer.domElement;


// ============================================================
// SCENE
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x050505);


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    60,
    W / H,
    0.05,
    100
  );


// ============================================================
// CONTROLS
// ============================================================

const controls =
  new OrbitControls(
    camera,
    cv
  );

controls.enableDamping =
  true;

controls.minDistance =
  0.4;

controls.maxDistance =
  8;


// ============================================================
// LIGHTING
// ============================================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x553333,
    1.1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    1.4
  );

sun.position.set(
  2,
  4,
  3
);

scene.add(sun);


// ============================================================
// GLTF LOADERS
// ============================================================

const draco =
  new DRACOLoader()
    .setDecoderPath(
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/'
    );

const gl =
  new GLTFLoader()
    .setDRACOLoader(draco)
    .setMeshoptDecoder(
      MeshoptDecoder
    );


const load =
  file =>
    gl
      .loadAsync(
        encodeURI(file)
      )
      .then(
        result =>
          result.scene
      );


// ============================================================
// MODEL WRAPPER
//
// Converts model into approximate real-world size.
// Pivot is placed around bottom-center.
// ============================================================

function wrap(
  object,
  dimension,
  targetSize
){

  const size =
    box(object).getSize(
      V()
    );


  const currentSize =
    dimension === 'xz'
      ? Math.max(
          size.x,
          size.z
        )
      : size[dimension];


  object.scale.multiplyScalar(
    targetSize / currentSize
  );

  object.updateMatrixWorld(
    true
  );


  const bounds =
    box(object);

  const center =
    bounds.getCenter(V());


  object.position.sub(
    V(
      center.x,
      bounds.min.y,
      center.z
    )
  );


  const group =
    new THREE.Group();

  group.add(object);

  return group;
}


// ============================================================
// VISIBILITY HELPER
// ============================================================

const isVis =
  object => {

    for(
      let current = object;
      current;
      current = current.parent
    ){

      if(!current.visible)
        return false;
    }

    return true;
  };


// ============================================================
// CHAIR MATERIAL FIX
//
// Keeps texture if GLB provides one.
//
// If texture/material is missing or white,
// makes the chair look like a dark/black gaming chair.
// ============================================================

function fixChairMaterials(
  chair
){

  chair.traverse(
    object => {

      if(
        !object.isMesh ||
        !object.material
      ){

        return;
      }


      const materials =
        Array.isArray(
          object.material
        )
        ? object.material
        : [object.material];


      materials.forEach(
        material => {

          // -----------------------------------------------
          // Keep existing texture map.
          // -----------------------------------------------

          if(material.map){

            /*
             * The texture remains active.
             *
             * Dark color acts as a multiplier,
             * producing a black/dark gaming-chair look.
             */

            material.color.set(
              0x555555
            );

          }else{

            /*
             * If the GLB has no texture,
             * create a clean dark chair material.
             */

            material.color.set(
              0x15171a
            );
          }


          // -----------------------------------------------
          // Realistic chair roughness
          // -----------------------------------------------

          material.roughness =
            Math.max(
              material.roughness ?? 0.7,
              0.55
            );


          material.metalness =
            Math.min(
              material.metalness ?? 0,
              0.15
            );


          material.needsUpdate =
            true;

        }
      );

    }
  );
}


// ============================================================
// WALL DECOR GEOMETRY DETECTION
//
// Screenshot অনুযায়ী wall-এর framed object-এর নাম
// GLB-তে অন্যরকম/unknown হলেও geometry দেখে detect করার
// চেষ্টা করবে.
//
// আমরা খুব বড় wall/floor/ceiling বাদ দিচ্ছি।
// ============================================================

function looksLikeWallDecor(
  object,
  roomBounds
){

  if(
    !object.isMesh ||
    !object.geometry
  ){

    return false;
  }


  const b =
    new THREE.Box3()
      .setFromObject(
        object
      );


  const size =
    b.getSize(
      V()
    );


  const center =
    b.getCenter(
      V()
    );


  // ----------------------------------------------------------
  // Ignore huge architectural surfaces
  // ----------------------------------------------------------

  if(
    size.x > 2.5 ||
    size.y > 2.7 ||
    size.z > 2.5
  ){

    return false;
  }


  // ----------------------------------------------------------
  // Very small objects are not useful candidates
  // ----------------------------------------------------------

  if(
    size.x < 0.08 &&
    size.y < 0.08 &&
    size.z < 0.08
  ){

    return false;
  }


  // ----------------------------------------------------------
  // Wall art is usually:
  //
  // vertical
  // relatively flat
  // not extremely tall
  // ----------------------------------------------------------

  const horizontal =
    Math.max(
      size.x,
      size.z
    );

  const depth =
    Math.min(
      size.x,
      size.z
    );


  const verticalRatio =
    size.y /
    Math.max(
      horizontal,
      0.001
    );


  const flat =
    depth <
    horizontal * 0.35;


  const vertical =
    verticalRatio > 0.8 &&
    verticalRatio < 3.5;


  // ----------------------------------------------------------
  // It should be somewhere above floor level.
  // ----------------------------------------------------------

  const aboveFloor =
    center.y >
    roomBounds.min.y + 0.65;


  // ----------------------------------------------------------
  // Don't hide things very close to the ceiling.
  // ----------------------------------------------------------

  const belowCeiling =
    center.y <
    roomBounds.max.y - 0.25;


  return (
    flat &&
    vertical &&
    aboveFloor &&
    belowCeiling
  );
}


// ============================================================
// MAIN
// ============================================================

try{

  // ----------------------------------------------------------
  // Load all models
  // ----------------------------------------------------------

  const [
    roomS,
    tableS,
    chairS,
    laptopS
  ] =
    await Promise.all([

      CFG.room,
      CFG.table,
      CFG.chair,
      CFG.laptop

    ].map(load));


  // ----------------------------------------------------------
  // Wrap / resize models
  // ----------------------------------------------------------

  const room =
    wrap(
      roomS,
      'y',
      CFG.roomHeight
    );


  const table =
    wrap(
      tableS,
      'y',
      CFG.tableHeight
    );


  const chair =
    wrap(
      chairS,
      'y',
      CFG.chairHeight
    );


  const laptop =
    wrap(
      laptopS,
      'xz',
      CFG.laptopWidth
    );


  // ----------------------------------------------------------
  // Add to scene
  // ----------------------------------------------------------

  scene.add(
    room,
    table,
    chair,
    laptop
  );


  room.updateMatrixWorld(
    true
  );


  // ----------------------------------------------------------
  // Fix chair material
  // ----------------------------------------------------------

  fixChairMaterials(
    chair
  );


  // ==========================================================
  // ROOM OBJECT DETECTION
  // ==========================================================

  const stack = [];


  function hideObj(
    node
  ){

    if(
      !node ||
      !node.visible
    ){

      return;
    }


    node.visible =
      false;

    stack.push(
      node
    );
  }


  const furn = [];
  const tvs = [];
  const wallDecor = [];


  const roomBounds =
    box(room);


  // ----------------------------------------------------------
  // Traverse room
  // ----------------------------------------------------------

  roomS.traverse(
    node => {

      const name =
        node.name || '';


      // ---------------------------------------------
      // Named TV / screen
      // ---------------------------------------------

      if(
        name &&
        CFG.hideTV.test(
          name
        )
      ){

        tvs.push(
          node
        );

        return;
      }


      // ---------------------------------------------
      // Named furniture
      // ---------------------------------------------

      if(
        name &&
        (
          CFG.hide.includes(
            name
          )
          ||
          CFG.hideFurniture.test(
            name
          )
        )
      ){

        furn.push(
          node
        );

        return;
      }


      // ---------------------------------------------
      // Named wall decoration
      // ---------------------------------------------

      if(
        name &&
        CFG.hideWallObject.test(
          name
        )
      ){

        wallDecor.push(
          node
        );

        return;
      }


      // ---------------------------------------------
      // Geometry-based wall decoration
      //
      // This is the important part for the
      // object visible in your screenshot.
      // ---------------------------------------------

      if(
        looksLikeWallDecor(
          node,
          roomBounds
        )
      ){

        wallDecor.push(
          node
        );
      }

    }
  );


  // ==========================================================
  // HIDE DETECTED OBJECTS
  // ==========================================================

  [
    ...furn,
    ...tvs,
    ...wallDecor
  ]
  .forEach(
    hideObj
  );


  // ==========================================================
  // ANCHOR
  //
  // Table positioning uses remaining furniture / room anchor.
  // ==========================================================

  const anchor =
    new THREE.Box3();


  furn.forEach(
    node => {

      anchor.union(
        box(node)
      );

    }
  );


  // ----------------------------------------------------------
  // If furniture anchor isn't available,
  // use a stable default.
  // ----------------------------------------------------------

  let msg =
    'Ready';


  if(
    anchor.isEmpty()
  ){

    anchor.setFromCenterAndSize(
      V(
        0,
        0.4,
        roomBounds.min.z + 0.8
      ),

      V(
        1,
        0.8,
        0.5
      )
    );


    msg =
      'Ready · auto anchor';
  }


  // ==========================================================
  // PLACE TABLE + LAPTOP + CHAIR
  // ==========================================================

  function place(
    first
  ){

    const center =
      anchor.getCenter(
        V()
      );


    const floorY =
      anchor.min.y;


    const roomCenter =
      box(room).getCenter(
        V()
      );


    // --------------------------------------------------------
    // Determine room-facing direction
    // --------------------------------------------------------

    const yaw =
      Math.round(
        Math.atan2(
          roomCenter.x - center.x,
          roomCenter.z - center.z
        )
        /
        (Math.PI / 2)
      )
      *
      (Math.PI / 2);


    const dir =
      V(
        Math.sin(yaw),
        0,
        Math.cos(yaw)
      );


    const axis =
      Math.abs(dir.x) > 0.5
        ? 'x'
        : 'z';


    // ========================================================
    // TABLE
    // ========================================================

    table.rotation.y =
      yaw +
      rad(
        CFG.yaw.table
      );


    table.position.set(
      center.x,
      floorY,
      center.z
    );


    table.updateMatrixWorld(
      true
    );


    const tableBox =
      box(table);


    // ========================================================
    // LAPTOP
    //
    // 180° rotation fixes the upside/backwards orientation.
    // ========================================================

    laptop.rotation.y =
      yaw +
      rad(
        CFG.yaw.laptop
      );


    laptop.position.set(
      center.x,
      tableBox.max.y,
      center.z
    );


    laptop.updateMatrixWorld(
      true
    );


    // ========================================================
    // CHAIR
    // ========================================================

    chair.rotation.y =
      yaw +
      Math.PI +
      rad(
        CFG.yaw.chair
      );


    chair.updateMatrixWorld(
      true
    );


    const chairSize =
      box(chair)
        .getSize(
          V()
        );


    const distance =
      tableBox
        .getSize(
          V()
        )[axis] / 2

      +

      chairSize[axis] / 2

      -

      0.1;


    chair.position.set(

      center.x +
      dir.x *
      distance,

      floorY,

      center.z +
      dir.z *
      distance

    );


    // --------------------------------------------------------
    // Camera target
    // --------------------------------------------------------

    controls.target.set(
      center.x,
      floorY + 0.9,
      center.z
    );


    // --------------------------------------------------------
    // Initial camera
    // --------------------------------------------------------

    if(first){

      camera.position.set(

        center.x +
        dir.x * 2.2,

        floorY + 1.7,

        center.z +
        dir.z * 2.2

      );

    }

  }


  place(true);


  // ==========================================================
  // STATUS
  // ==========================================================

  st(
    msg +
    ' · hidden: ' +
    stack
      .map(
        node =>
          node.name ||
          node.type
      )
      .join(', ')
  );


  // ==========================================================
  // REMOVE MODE
  // ==========================================================

  let pick =
    false;

  let mouseDown =
    [0,0];

  let anchorUpdated =
    false;


  const ray =
    new THREE.Raycaster();


  const mouse =
    new THREE.Vector2();


  // ----------------------------------------------------------
  // Keyboard
  // ----------------------------------------------------------

  addEventListener(
    'keydown',
    event => {

      // H = remove mode

      if(
        event.key.toLowerCase()
        ===
        'h'
      ){

        pick =
          !pick;


        cv.style.cursor =
          pick
            ? 'crosshair'
            : '';


        st(
          pick
            ? 'Remove-mode ON · object click kore hide koro'
            : 'Remove-mode OFF'
        );

      }


      // Z = undo

      if(
        event.key.toLowerCase()
        ===
        'z'
        &&
        stack.length
      ){

        const object =
          stack.pop();


        object.visible =
          true;


        st(
          'Undo: ' +
          (
            object.name ||
            object.type
          )
        );

      }

    }
  );


  // ==========================================================
  // MOUSE DOWN
  // ==========================================================

  cv.addEventListener(
    'pointerdown',
    event => {

      mouseDown =
        [
          event.clientX,
          event.clientY
        ];

    }
  );


  // ==========================================================
  // MOUSE UP
  // ==========================================================

  cv.addEventListener(
    'pointerup',
    event => {

      if(
        !pick
      ){

        return;
      }


      // Ignore camera drag
      if(
        Math.hypot(
          event.clientX -
          mouseDown[0],

          event.clientY -
          mouseDown[1]
        )
        >
        4
      ){

        return;
      }


      const rect =
        cv.getBoundingClientRect();


      mouse.set(

        (
          event.clientX -
          rect.left
        )
        /
        rect.width
        *
        2
        -
        1,

        -(
          (
            event.clientY -
            rect.top
          )
          /
          rect.height
        )
        *
        2
        +
        1

      );


      ray.setFromCamera(
        mouse,
        camera
      );


      const hits =
        ray
          .intersectObject(
            room,
            true
          )
          .filter(
            hit =>
              isVis(
                hit.object
              )
          );


      if(
        !hits.length
      ){

        return;
      }


      const selected =
        hits[0].object;


      hideObj(
        selected
      );


      // ------------------------------------------------------
      // Shift + click:
      // update table anchor
      // ------------------------------------------------------

      if(
        event.shiftKey
      ){

        if(
          !anchorUpdated
        ){

          anchor.makeEmpty();

          anchorUpdated =
            true;

        }


        anchor.union(
          box(selected)
        );


        place(false);

      }


      st(
        'Hidden: ' +
        (
          selected.name ||
          selected.type
        )
        +
        ' (' +
        stack.length +
        ' total)'
      );

    }
  );


  // ==========================================================
  // RENDER LOOP
  // ==========================================================

  renderer.setAnimationLoop(
    () => {

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }
  );


}
catch(error){

  console.error(
    error
  );


  st(
    'Error: ' +
    error.message
  );

}

</script>

</body>
</html>
