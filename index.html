<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>BLAXCY Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{
  margin:0;
  height:100%;
  background:#050505;
  color:#eee;
  font:13px system-ui,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  width:min(100vw,calc(100vh*16/9));
  aspect-ratio:16/9;
  height:auto;
  display:block;
}

#hud{
  position:fixed;
  left:10px;
  top:10px;
  background:#000a;
  padding:8px 12px;
  border-radius:8px;
  line-height:1.5;
  max-width:520px;
  z-index:10;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="hud">
  <b>BLAXCY Room</b> · 2K (2560×1440)<br>
  <span id="st">Loading…</span><br>
  <small>
    Drag: ghurao · Scroll: zoom ·
    H: remove-mode · Shift+click: table er jayga set · Z: undo
  </small>
</div>

<script type="module">

import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';


// ============================================================
// CONFIG
// ============================================================

const CFG = {

  room: 'red_room (1).glb',

  table: 'table.glb',

  chair: 'black_ergonomic_gaming_chair.glb',

  laptop: 'laptop_and_mouse.glb',


  // Room height
  roomHeight: 2.8,


  // Table lower than previous version
  tableHeight: 0.68,


  // Chair
  chairHeight: 1.1,


  // Laptop size
  laptopWidth: 0.6,


  // ========================================================
  // ROOM OBJECTS TO HIDE
  // ========================================================

  hideTV:
    /(^|[^a-z])(tv|television|monitor|screen)([^a-z]|$)/i,


  hideFurniture:
    /dresser|cabinet|drawer|commode|sideboard|console|tv[_\s-]?(stand|unit|table)|chest/i,


  // Door / doorway / door-frame
  hideDoor:
    /door|doorway|doorframe|door_frame|door-frame|entrance/i,


  // Wall decorations
  hideWallDecor:
    /painting|picture|wall[_\s-]?art|artwork|frame|poster|photo|decoration/i,


  // Exact names can be added here if necessary
  hide: [],


  // ========================================================
  // MODEL ROTATIONS
  // ========================================================

  yaw: {
    table: 0,
    chair: 0,
    laptop: 180
  },


  // ========================================================
  // ROOM-RELATIVE LAPTOP SETUP POSITION
  //
  // x = left/right
  // z = forward/back
  //
  // 0 = room center
  // ========================================================

  setupOffsetX: 0,

  setupOffsetZ: -0.18
};


// ============================================================
// BASIC
// ============================================================

const W = 2560;
const H = 1440;

const $ = id => document.getElementById(id);

const st = text => {
  $('st').textContent = text;
};

const V = (x=0,y=0,z=0) =>
  new THREE.Vector3(x,y,z);

const rad = d =>
  d * Math.PI / 180;

const box = obj =>
  new THREE.Box3().setFromObject(obj);


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(1);

renderer.setSize(
  W,
  H,
  false
);

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.1;

document.body.appendChild(
  renderer.domElement
);

const cv = renderer.domElement;


// ============================================================
// SCENE
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x050505);


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    60,
    W/H,
    0.05,
    100
  );


// ============================================================
// CONTROLS
// ============================================================

const controls =
  new OrbitControls(
    camera,
    cv
  );

controls.enableDamping = true;

controls.minDistance = 0.4;

controls.maxDistance = 8;


// ============================================================
// LIGHT
// ============================================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x553333,
    1.1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    1.4
  );

sun.position.set(
  2,
  4,
  3
);

scene.add(sun);


// ============================================================
// GLTF LOADERS
// ============================================================

const draco =
  new DRACOLoader();

draco.setDecoderPath(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/'
);

const gl =
  new GLTFLoader();

gl.setDRACOLoader(draco);

gl.setMeshoptDecoder(
  MeshoptDecoder
);


const load = file =>
  gl.loadAsync(
    encodeURI(file)
  ).then(
    result => result.scene
  );


// ============================================================
// MODEL WRAPPER
// ============================================================
//
// Model-কে real-world size এ আনা হয়।
// Pivot নিচের মাঝখানে রাখা হয়।
// ============================================================

function wrap(obj, dimension, value){

  const size =
    box(obj).getSize(V());


  let current;

  if(dimension === 'xz'){

    current =
      Math.max(
        size.x,
        size.z
      );

  }else{

    current =
      size[dimension];

  }


  if(!current || !isFinite(current)){
    return obj;
  }


  obj.scale.multiplyScalar(
    value / current
  );

  obj.updateMatrixWorld(true);


  const b =
    box(obj);

  const c =
    b.getCenter(V());


  // Bottom-center pivot
  obj.position.sub(
    V(
      c.x,
      b.min.y,
      c.z
    )
  );


  const group =
    new THREE.Group();

  group.add(obj);

  return group;
}


// ============================================================
// VISIBILITY CHECK
// ============================================================

function isVisible(obj){

  for(
    let p=obj;
    p;
    p=p.parent
  ){

    if(!p.visible){
      return false;
    }

  }

  return true;
}


// ============================================================
// MAIN
// ============================================================

try{

  // ----------------------------------------------------------
  // LOAD ALL MODELS
  // ----------------------------------------------------------

  const [
    roomS,
    tableS,
    chairS,
    laptopS
  ] = await Promise.all([

    CFG.room,

    CFG.table,

    CFG.chair,

    CFG.laptop

  ].map(load));


  // ----------------------------------------------------------
  // WRAP / SCALE
  // ----------------------------------------------------------

  const room =
    wrap(
      roomS,
      'y',
      CFG.roomHeight
    );


  const table =
    wrap(
      tableS,
      'y',
      CFG.tableHeight
    );


  const chair =
    wrap(
      chairS,
      'y',
      CFG.chairHeight
    );


  const laptop =
    wrap(
      laptopS,
      'xz',
      CFG.laptopWidth
    );


  scene.add(
    room,
    table,
    chair,
    laptop
  );


  room.updateMatrixWorld(true);


  // ==========================================================
  // CHAIR MATERIAL FIX
  // ==========================================================

  chair.traverse(node => {

    if(!node.isMesh) return;

    const materials =
      Array.isArray(node.material)
        ? node.material
        : [node.material];


    materials.forEach(mat => {

      if(!mat) return;


      // Existing texture থাকলে সেটা preserve
      // কিন্তু chair খুব light হলে dark করা
      if(mat.map){

        mat.color.setHex(
          0x777777
        );

      }else{

        mat.color.setHex(
          0x17191d
        );

      }


      mat.roughness = 0.65;

      mat.metalness = 0.05;

    });

  });


  // ==========================================================
  // HIDDEN OBJECT STACK
  // ==========================================================

  const stack = [];


  function hideObj(obj){

    if(!obj) return;

    if(obj.visible){

      obj.visible = false;

      stack.push(obj);

    }

  }


  // ==========================================================
  // ROOM OBJECT DETECTION
  // ==========================================================

  const hiddenNodes = [];


  roomS.traverse(node => {

    const name =
      node.name || '';


    // --------------------------------------------------------
    // Check own name
    // --------------------------------------------------------

    const ownNameMatch =

      CFG.hide.includes(name) ||

      CFG.hideTV.test(name) ||

      CFG.hideFurniture.test(name) ||

      CFG.hideDoor.test(name) ||

      CFG.hideWallDecor.test(name);


    // --------------------------------------------------------
    // Check parents
    //
    // অনেক GLB-তে mesh-এর নাম "Floor_0" হলেও
    // parent-এর নাম "Door" হতে পারে।
    // --------------------------------------------------------

    let parentMatch = false;

    let p = node.parent;

    while(p && p !== roomS){

      const pn =
        p.name || '';


      if(

        CFG.hideDoor.test(pn) ||

        CFG.hideTV.test(pn) ||

        CFG.hideFurniture.test(pn) ||

        CFG.hideWallDecor.test(pn)

      ){

        parentMatch = true;

        break;

      }


      p = p.parent;

    }


    if(
      ownNameMatch ||
      parentMatch
    ){

      hideObj(node);

      hiddenNodes.push(
        name || node.type
      );

    }

  });


  // ==========================================================
  // ROOM BOUNDS
  // ==========================================================

  room.updateMatrixWorld(true);

  const roomBox =
    box(room);

  const roomSize =
    roomBox.getSize(V());

  const roomCenter =
    roomBox.getCenter(V());


  const floorY =
    roomBox.min.y;


  // ==========================================================
  // LAPTOP SETUP POSITION
  // ==========================================================
  //
  // Drawer/cabinet-এর উপর আর depend করবে না।
  //
  // Room-এর center থেকে fixed relative position।
  // ==========================================================

  const setupX =
    roomCenter.x +
    roomSize.x *
    CFG.setupOffsetX;


  const setupZ =
    roomCenter.z +
    roomSize.z *
    CFG.setupOffsetZ;


  const setup =
    V(
      setupX,
      floorY,
      setupZ
    );


  // ==========================================================
  // SETUP ORIENTATION
  // ==========================================================
  //
  // Chair + laptop একই দিকে থাকবে।
  //
  // Table front = -Z
  // Chair = +Z
  // Laptop front = -Z
  // ==========================================================

  const setupYaw =
    0;


  const dir =
    V(
      Math.sin(setupYaw),
      0,
      Math.cos(setupYaw)
    );


  // ==========================================================
  // TABLE
  // ==========================================================

  table.rotation.y =
    setupYaw +
    rad(CFG.yaw.table);


  table.position.set(
    setup.x,
    floorY,
    setup.z
  );


  table.updateMatrixWorld(true);


  // Make absolutely sure table touches floor
  let tableBox =
    box(table);


  table.position.y +=
    floorY -
    tableBox.min.y;


  table.updateMatrixWorld(true);


  tableBox =
    box(table);


  // ==========================================================
  // LAPTOP
  // ==========================================================
  //
  // Laptop table-এর top-এর উপর বসবে।
  // Chair থেকে laptop usable orientation।
  // ==========================================================

  laptop.rotation.y =
    setupYaw +
    rad(CFG.yaw.laptop);


  laptop.position.set(
    setup.x,
    tableBox.max.y + 0.012,
    setup.z
  );


  laptop.updateMatrixWorld(true);


  // ==========================================================
  // CHAIR
  // ==========================================================
  //
  // Chair table-এর সামনে থাকবে।
  // Chair table-এর দিকে মুখ করবে।
  // ==========================================================

  chair.rotation.y =
    setupYaw +
    Math.PI +
    rad(CFG.yaw.chair);


  chair.updateMatrixWorld(true);


  const chairSize =
    box(chair).getSize(V());


  const tableSize =
    box(table).getSize(V());


  // Table থেকে comfortable distance
  const chairDistance =
    tableSize.z / 2 +
    chairSize.z / 2 -
    0.08;


  chair.position.set(
    setup.x,
    floorY,
    setup.z +
    chairDistance
  );


  chair.updateMatrixWorld(true);


  // Make chair touch floor
  let chairBox =
    box(chair);


  chair.position.y +=
    floorY -
    chairBox.min.y;


  chair.updateMatrixWorld(true);


  // ==========================================================
  // CAMERA
  // ==========================================================

  controls.target.set(
    setup.x,
    floorY + 0.9,
    setup.z
  );


  camera.position.set(
    setup.x + 2.6,
    floorY + 1.8,
    setup.z + 2.6
  );


  camera.lookAt(
    setup.x,
    floorY + 0.9,
    setup.z
  );


  // ==========================================================
  // STATUS
  // ==========================================================

  st(
    'Ready · setup fixed inside room · hidden: ' +
    hiddenNodes.length
  );


  console.info(
    'Hidden room nodes:',
    hiddenNodes
  );


  console.info(
    'Room bounds:',
    roomBox
  );


  console.info(
    'Setup position:',
    setup
  );


  // ==========================================================
  // REMOVE MODE
  // ==========================================================

  let pick = false;

  let pointerDown =
    [0,0];


  let manualAnchor =
    false;


  const ray =
    new THREE.Raycaster();


  const mouse =
    new THREE.Vector2();


  // ----------------------------------------------------------
  // KEYBOARD
  // ----------------------------------------------------------

  addEventListener(
    'keydown',
    event => {

      const key =
        event.key.toLowerCase();


      // H = Remove mode
      if(key === 'h'){

        pick = !pick;


        cv.style.cursor =
          pick
            ? 'crosshair'
            : '';


        st(
          pick
            ? 'Remove-mode ON: click kore object hide koro'
            : 'Remove-mode OFF'
        );

      }


      // Z = Undo
      if(
        key === 'z' &&
        stack.length
      ){

        const obj =
          stack.pop();


        obj.visible = true;


        st(
          'Undo: ' +
          (
            obj.name ||
            obj.type
          )
        );

      }

    }
  );


  // ==========================================================
  // POINTER DOWN
  // ==========================================================

  cv.addEventListener(
    'pointerdown',
    event => {

      pointerDown = [
        event.clientX,
        event.clientY
      ];

    }
  );


  // ==========================================================
  // POINTER UP
  // ==========================================================

  cv.addEventListener(
    'pointerup',
    event => {

      if(!pick) return;


      const movement =
        Math.hypot(
          event.clientX -
          pointerDown[0],

          event.clientY -
          pointerDown[1]
        );


      // Orbit drag হলে remove করবে না
      if(movement > 4) return;


      const rect =
        cv.getBoundingClientRect();


      mouse.set(

        (
          (event.clientX -
          rect.left) /
          rect.width
        ) * 2 - 1,

        -(
          (
            event.clientY -
            rect.top
          ) /
          rect.height
        ) * 2 + 1

      );


      ray.setFromCamera(
        mouse,
        camera
      );


      const hits =
        ray.intersectObject(
          room,
          true
        );


      const hit =
        hits.find(
          item =>
            isVisible(
              item.object
            )
        );


      if(!hit) return;


      const object =
        hit.object;


      // Hide clicked mesh
      hideObj(object);


      // ------------------------------------------------------
      // Shift + click
      // নতুন table position anchor হিসেবে clicked location
      // ------------------------------------------------------

      if(event.shiftKey){

        if(!manualAnchor){

          manualAnchor = true;

        }


        const hitPoint =
          hit.point;


        table.position.x =
          hitPoint.x;


        table.position.z =
          hitPoint.z;


        table.position.y =
          floorY;


        table.updateMatrixWorld(
          true
        );


        const newTableBox =
          box(table);


        laptop.position.set(
          hitPoint.x,
          newTableBox.max.y + 0.012,
          hitPoint.z
        );


        laptop.updateMatrixWorld(
          true
        );


        const tSize =
          newTableBox.getSize(V());


        const cSize =
          box(chair).getSize(V());


        const d =
          tSize.z / 2 +
          cSize.z / 2 -
          0.08;


        chair.position.set(
          hitPoint.x,
          floorY,
          hitPoint.z + d
        );


        chair.updateMatrixWorld(
          true
        );


        st(
          'Setup moved · ' +
          (
            object.name ||
            object.type
          )
        );

      }else{

        st(
          'Hidden: ' +
          (
            object.name ||
            object.type
          ) +
          ' · ' +
          stack.length +
          ' total'
        );

      }


      console.info(
        'Hidden:',
        object.name ||
        object.type
      );

    }
  );


  // ==========================================================
  // ANIMATION LOOP
  // ==========================================================

  renderer.setAnimationLoop(
    () => {

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }
  );


}catch(error){

  console.error(
    'BLAXCY Room Error:',
    error
  );


  st(
    'Error: ' +
    error.message
  );

}

</script>

</body>
</html>
